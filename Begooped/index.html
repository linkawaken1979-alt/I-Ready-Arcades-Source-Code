<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>Begooped</title>

  <link rel="icon" type="image/png" href="icon/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="icon/favicon-16x16.png" sizes="16x16">
  <link rel="icon" type="image/png" href="icon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/png" href="icon/favicon-128.png" sizes="128x128">
  <link rel="icon" type="image/png" href="icon/favicon-196x196.png" sizes="196x196">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #gameContainer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #gameContainer canvas {
      display: block;
      flex: 0 0 auto;
      max-width: none !important;
      max-height: none !important;
      margin: 0;
      padding: 0;
      outline: none;
      touch-action: none;
    }

    #fullWindowHolder {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .loaderContainer {
      text-align: center;
    }

    .loadingLabel {
      color: #fff;
      font: 14px Arial, sans-serif;
      margin-top: 16px;
    }

    .loader, .loader:after {
      border-radius: 50%;
      width: 5em;
      height: 5em;
    }

    .loader {
      margin: 20px auto;
      font-size: 10px;
      position: relative;
      text-indent: -9999em;
      border-top: .7em solid rgba(32, 206, 247, .2);
      border-right: .7em solid rgba(32, 206, 247, .2);
      border-bottom: .7em solid rgba(32, 206, 247, .2);
      border-left: .7em solid #20cef7;
      animation: load8 1.1s infinite linear;
    }

    @keyframes load8 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script src="libs/phaser/phaser-ce-2.16.0.min.js"></script>

  <script>
    var init = function () {};

    try {
      if (window.parent !== window &&
          window.parent.gameBridge &&
          typeof window.parent.gameBridge.initialized === "function") {
        init = window.parent.gameBridge.initialized;
      }
    } catch (e) {}

    function displayGame() {
      var loader = document.getElementById("fullWindowHolder");
      if (loader) loader.style.display = "none";

      try {
        init();
      } catch (e) {
        console.warn("Game bridge initialization failed:", e);
      }

      fitGameCanvas();
    }

    function fitGameCanvas() {
      var container = document.getElementById("gameContainer");
      var canvas = container && container.querySelector("canvas");
      if (!canvas) return;

      // Use the canvas's native backing resolution.
      var gameWidth = canvas.width;
      var gameHeight = canvas.height;

      if (!gameWidth || !gameHeight) return;

      // Cover the viewport completely; crop overflow instead of showing bars.
      var scale = Math.max(
        window.innerWidth / gameWidth,
        window.innerHeight / gameHeight
      );

      canvas.style.setProperty("width", Math.ceil(gameWidth * scale) + "px", "important");
      canvas.style.setProperty("height", Math.ceil(gameHeight * scale) + "px", "important");
      canvas.style.setProperty("max-width", "none", "important");
      canvas.style.setProperty("max-height", "none", "important");
    }

    window.addEventListener("resize", fitGameCanvas);
    window.addEventListener("orientationchange", fitGameCanvas);

    window.addEventListener("error", function (event) {
      console.error("Game error:", event.message || event.error || event);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "F11") {
        event.preventDefault();

        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen()
            .then(fitGameCanvas)
            .catch(function () {});
        } else {
          document.exitFullscreen()
            .then(fitGameCanvas)
            .catch(function () {});
        }
      }
    });

    document.addEventListener("fullscreenchange", fitGameCanvas);

    window.addEventListener("load", function () {
      var container = document.getElementById("gameContainer");
      if (!container) return;

      var observer = new MutationObserver(fitGameCanvas);
      observer.observe(container, { childList: true });

      fitGameCanvas();
    });
  </script>
</head>

<body>
  <div id="fullWindowHolder">
    <div class="loaderContainer">
      <div class="loader">Loading...</div>
      <div id="loadingLabel" class="loadingLabel">Loading Begooped...</div>
    </div>
  </div>

  <div id="gameContainer"></div>

  <script src="manifest.47136ca705edb95b715d.js"></script>
  <script src="vendor.849c7b9ad19db6d19324.js"></script>
  <script src="bundle.f61d9dfc542d250f31e8.js"></script>
</body>
</html>
